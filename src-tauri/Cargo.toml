[workspace]
members = [
    ".",
    "crates/contextkit-core",
    "crates/contextkit-cli",
    "crates/contextkit-tui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["you"]

[package]
name = "contextkit-gui"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "ContextKit GUI"

[lib]
name = "contextkit_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "contextkit"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
contextkit-core = { path = "crates/contextkit-core" }
